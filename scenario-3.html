<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Webpage</title>
    <style>
        /* Styling the header */
        header {
            background-color: lightgray;
            text-align: center;
            padding: 10px;
            font-size: 24px;
        }

        /* Styling the paragraph */
        p {
            border: 1px solid black;
            padding: 10px;
            font-size: 18px;
        }

        /* Styling the footer */
        footer {
            color: darkgreen;
            text-align: center;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <header>
        Welcome to My Webpage
    </header>

    <p>
        This is a simple paragraph with a 1px solid border around it. Internal CSS ensures consistent styling across the webpage.
    </p>

    <footer>
        © 2025 All Rights Reserved
    </footer>
</body>
</html>
